<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}THE BASICS{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}THE BASICS — UPSC and competitive exam preparation: subject notes, prelims MCQs, mains PYQs, current affairs, and self-evaluation.{% endblock %}">
    <link rel="canonical" href="{{ request.build_absolute_uri(request.path) }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% block stylesheets %}
    <link rel="stylesheet" href="{{ static('css/legacy.css') }}">
    {% endblock %}

    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include "partials/navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="{{ static('js/legacy.js') }}"></script>
    <script>
        const copyYear = document.getElementById('copyrightYear');
        if (copyYear) copyYear.textContent = new Date().getFullYear();
    </script>
    <script>
        // Bare hx-post buttons (no <form>/csrf_input) still need CSRF —
        // standard Django+HTMX pattern: attach the cookie token as a header
        // on every htmx request, once, globally.
        document.body.addEventListener('htmx:configRequest', (event) => {
            const match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
            if (match) event.detail.headers['X-CSRFToken'] = match[1];
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
