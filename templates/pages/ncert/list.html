{% extends "base.html" %}
{% block title %}NCERT Practice | THE BASICS{% endblock %}
{% block stylesheets %}
<link rel="stylesheet" href="{{ static('css/legacy.css') }}">
<link rel="stylesheet" href="{{ static('css/evaluation-theme.css') }}">
<link rel="stylesheet" href="{{ static('css/ncert-theme.css') }}">
{% endblock %}
{% block content %}
<div style="padding-top: 100px; padding-left: 20px; padding-right: 20px;">
    <div class="ncert-app-header">
        <div class="ncert-app-title"><i class="fas fa-book-open"></i> NCERT Base Module</div>
    </div>

    <div class="ncert-shell">
        <aside class="ncert-sidebar">
            <form class="ncert-filter-card"
                  hx-get="{{ url('ncert:list') }}" hx-target="#question-results" hx-swap="outerHTML" hx-push-url="true">
                <div class="ncert-filter-title"><i class="fas fa-filter"></i> Filters</div>

                <div class="ncert-filter-group">
                    <label class="ncert-filter-label">Subject</label>
                    <select name="subject" class="ncert-filter-select"
                            hx-get="{{ url('ncert:topic_options') }}" hx-target="#topic-select" hx-swap="outerHTML" hx-trigger="change">
                        <option value="">All Subjects</option>
                        {% for s in subjects %}
                        <option value="{{ s.slug }}" {% if selected_subject == s.slug %}selected{% endif %}>{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="ncert-filter-group">
                    <label class="ncert-filter-label">Topic</label>
                    <select name="topic" id="topic-select" class="ncert-filter-select">
                        <option value="">All Topics</option>
                        {% for t in topics %}
                        <option value="{{ t.pk }}" {% if selected_topic == t.pk|string %}selected{% endif %}>{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="ncert-filter-group">
                    <label class="ncert-filter-label">Question Bank</label>
                    <select name="bank" class="ncert-filter-select">
                        <option value="">All Banks</option>
                        <option value="mcq" {% if selected_bank == 'mcq' %}selected{% endif %}>Practice MCQ</option>
                        <option value="pyq" {% if selected_bank == 'pyq' %}selected{% endif %}>PYQ</option>
                    </select>
                </div>

                <button type="submit" class="ncert-btn ncert-btn-primary ncert-filter-submit"><i class="fas fa-filter"></i> Apply Filters</button>
            </form>
        </aside>

        <main class="ncert-main">
            {% include "partials/ncert/question_results.html" %}
        </main>
    </div>
</div>

<a href="javascript:history.back()" class="floating-back-btn"><i class="fas fa-arrow-left"></i> Back</a>
{% endblock %}
