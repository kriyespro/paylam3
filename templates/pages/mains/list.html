{% extends "base.html" %}
{% block title %}Mains PYQ | THE BASICS{% endblock %}
{% block stylesheets %}
<link rel="stylesheet" href="{{ static('css/legacy.css') }}">
<link rel="stylesheet" href="{{ static('css/evaluation-theme.css') }}">
{% endblock %}
{% block content %}
<div class="ev-container" style="padding-top: 100px; max-width: 800px;">
    <div class="ev-header">
        <div class="ev-title">Mains PYQ <span>Practice</span></div>
        <a href="{{ url('mains:daily') }}" style="font-size: 0.85rem; font-weight: 700; color: var(--amber); text-decoration: none;">Today's Question &rarr;</a>
    </div>

    <form style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;"
          hx-get="{{ url('mains:list') }}" hx-target="#question-results" hx-swap="outerHTML" hx-push-url="true">
        <select name="paper" style="padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border-color); font-family: 'Inter', sans-serif;">
            <option value="">All Papers</option>
            {% for p in papers %}
            <option value="{{ p }}" {% if selected_paper == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
        <select name="subject" style="padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border-color); font-family: 'Inter', sans-serif;">
            <option value="">All Subjects</option>
            {% for s in subjects %}
            <option value="{{ s }}" {% if selected_subject == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
        <select name="year" style="padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border-color); font-family: 'Inter', sans-serif;">
            <option value="">All Years</option>
            {% for y in years %}
            <option value="{{ y }}" {% if selected_year == y|string %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-submit-main" style="padding: 8px 20px; font-size: 0.9rem;">Filter</button>
    </form>

    {% include "partials/mains/question_results.html" %}
</div>

<a href="javascript:history.back()" class="floating-back-btn"><i class="fas fa-arrow-left"></i> Back</a>
{% endblock %}
