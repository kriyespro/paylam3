{% extends "base.html" %}
{% block title %}Prelims Practice | THE BASICS{% endblock %}
{% block stylesheets %}
<link rel="stylesheet" href="{{ static('css/legacy.css') }}">
<link rel="stylesheet" href="{{ static('css/evaluation-theme.css') }}">
{% endblock %}
{% block content %}
<div class="ev-container" style="padding-top: 100px; max-width: 800px;">
    <div class="ev-header">
        <div class="ev-title">Prelims <span>Practice</span></div>
        <a href="{{ url('prelims:daily') }}" style="font-size: 0.85rem; font-weight: 700; color: var(--amber); text-decoration: none;">Today's Question &rarr;</a>
    </div>

    <form style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;"
          hx-get="{{ url('prelims:list') }}" hx-target="#question-results" hx-swap="outerHTML" hx-push-url="true">
        <select name="type" style="padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border-color); font-family: 'Inter', sans-serif;">
            <option value="">All Types</option>
            <option value="pyq" {% if selected_type == 'pyq' %}selected{% endif %}>PYQ</option>
            <option value="mcq" {% if selected_type == 'mcq' %}selected{% endif %}>Practice MCQ</option>
        </select>
        <select name="subject" style="padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border-color); font-family: 'Inter', sans-serif;">
            <option value="">All Subjects</option>
            {% for s in subjects %}
            <option value="{{ s }}" {% if selected_subject == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
        <select name="difficulty" style="padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border-color); font-family: 'Inter', sans-serif;">
            <option value="">All Difficulties</option>
            {% for d in difficulties %}
            <option value="{{ d }}" {% if selected_difficulty == d %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-submit-main" style="padding: 8px 20px; font-size: 0.9rem;">Filter</button>
    </form>

    {% include "partials/prelims/question_results.html" %}
</div>

<a href="javascript:history.back()" class="floating-back-btn"><i class="fas fa-arrow-left"></i> Back</a>
{% endblock %}
