{% extends "pages/platform_admin/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="pa-panel" style="max-width: 560px;">
    <p style="margin-bottom:20px;">Are you sure you want to delete <strong>{{ object }}</strong>? This can't be undone.</p>
    <form method="post">
        {{ csrf_input }}
        <div class="pa-form-actions">
            <button type="submit" class="pa-btn pa-btn-danger"><i class="fas fa-trash"></i> Delete</button>
            <a href="{{ cancel_url }}" class="pa-btn pa-btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
